# Server
server:
  port: ${SERVER_PORT:8080}

# Application
spring:
  application:
    name: knowledge-lab

  # Elasticsearch client — Spring Boot 4 / Spring Data Elasticsearch 6
  # Client connection properties live under spring.elasticsearch (NOT spring.data.elasticsearch).
  # spring.data.elasticsearch only covers repository/store-layer settings.
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connection-timeout: 30s
    socket-timeout: 30s

  # MongoDB
  data:
    mongodb:
      auto-index-creation: true

    # Redis
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 1000ms

    # Elasticsearch repository layer
    elasticsearch:
      repositories:
        enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  web:
    error:
      include-message: always
      include-binding-errors: always
  mongodb:
    uri: ${MONGODB_URI}
    database: ${MONGODB_DATABASE:appdb}

# JWT
jwt:
  secret: ${JWT_SECRET}                                         # min 256-bit base64 string
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}        # 15 min
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}   # 7 days
  issuer: ${JWT_ISSUER:knowledge-lab}

# Kafka
kafka:
  topics:
    annotation-events:      ${KAFKA_TOPIC_ANNOTATION_EVENTS:annotation-events}
    annotation-events-dlt:  ${KAFKA_TOPIC_ANNOTATION_EVENTS_DLT:annotation-events.DLT}
    partitions:             ${KAFKA_TOPIC_PARTITIONS:3}
    replication-factor:     ${KAFKA_REPLICATION_FACTOR:1}
  producer:
    retries:           3
    acks:              all
    linger-ms:         5
    batch-size:        16384
    compression-type:  snappy
  consumer:
    group-id:          ${KAFKA_CONSUMER_GROUP_ID:knowledge-lab-annotation-group}
    concurrency:       3
    max-poll-records:  50
    poll-timeout-ms:   3000

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator
management:
  health:
    mongodb:
      enabled: false
    elasticsearch:
      enabled: true
    kafka:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# Logging
logging:
  level:
    com.app: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.springframework.data.elasticsearch: WARN
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"